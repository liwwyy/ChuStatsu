plugins {
    id 'java'
    id 'fabric-loom' version '1.18-SNAPSHOT'
    id 'ploceus' version '1.18-SNAPSHOT'
}

group = project.mod_group
version = "${project.mod_version}+mc${project.minecraft_version}"

base {
    archivesName = project.mod_id
}

repositories {
    maven { url = 'https://repo.polyfrost.org/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    mappings ploceus.featherMappings(project.feather_build)
    ploceus.dependOsl(project.osl_version)

    compileOnly("org.polyfrost.oneconfig:config-impl:${project.oneconfig_version}") {
        transitive = false
    }
    compileOnly("org.polyfrost.oneconfig:events:${project.oneconfig_version}") {
        transitive = false
    }
    compileOnly("org.polyfrost.oneconfig:hud:${project.oneconfig_version}") {
        transitive = false
    }
    compileOnly("org.polyfrost.oneconfig:ui:${project.oneconfig_version}") {
        transitive = false
    }
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:2.4.20") {
        transitive = false
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation("org.polyfrost.oneconfig:hud:${project.oneconfig_version}") {
        transitive = false
    }
    testRuntimeOnly("org.jetbrains.kotlin:kotlin-stdlib:2.4.20") {
        transitive = false
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
